<section class="hero">
  <div class="container">
    <h1 class="hero-title">Bonjour <span class="user-name">[User]</span>,</h1>
    <p class="hero-subtitle">
      Bienvenue sur le site de la bibliothèque de l'association
      <strong>Quartier Solidaire</strong>.
    </p>
    <a routerLink="/catalogue" class="btn-primary hero-cta">
      Parcourir notre catalogue
    </a>

    <div class="search-bar">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (keydown)="onKeydown($event)"
        placeholder="Chercher votre future lecture"
        class="search-input"
      />
      <button class="search-btn" (click)="onSearch()" aria-label="Rechercher">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
  </div>
</section>

<!-- Livres les plus empruntés -->
<section class="books-section container">
  <h2 class="section-title">Livres les plus souvent empruntés</h2>
  <div class="books-grid">
    <app-book-card *ngFor="let book of mostBorrowed" [book]="book" />
  </div>
</section>

<!-- Livres les mieux notés -->
<section class="books-section container">
  <h2 class="section-title">Livres les mieux notés</h2>
  <div class="books-grid">
    <app-book-card *ngFor="let book of topRated" [book]="book" />
  </div>
</section>

<!-- Nouveaux livres -->
<section class="books-section container">
  <h2 class="section-title">Nouveaux livres</h2>
  <div class="books-grid">
    <app-book-card *ngFor="let book of newBooks" [book]="book" />
  </div>
</section>

<!-- Événements -->
<section class="events-section container">
  <h2 class="section-title">Évènements à venir</h2>
  <div class="events-grid">
    <div class="event-card" *ngFor="let event of upcomingEvents">
      <div class="event-img-wrap">
        <img [src]="event.image" [alt]="event.title" class="event-img" />
      </div>
      <div class="event-info">
        <h3 class="event-title">{{ event.title }}</h3>
        <p class="event-desc">{{ event.description }}</p>
        <a routerLink="/" class="btn-primary event-btn">Découvrir</a>
      </div>
    </div>
  </div>
</section>
